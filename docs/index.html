<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141318"><title>NieFigger Hub — Preview</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg);--bg:#141318;--fg:#eeeaf4;--surface:#25242c;--selected:#35284d;--accent:#d0bcff;--on:#30204d;--muted:#bdb7c7;--green:#a5d5b1}body.light{--bg:#faf8ff;--fg:#211e27;--surface:#eeedf3;--selected:#eaddff;--accent:#6750a4;--on:white;--muted:#625c6b;--green:#386a49}button,input,select{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;min-height:44px;border-radius:16px}button:active{opacity:.65}header{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px;z-index:2}header strong{flex:1;font-size:21px}header button{min-width:44px;font-size:23px}nav{display:flex;gap:6px;padding:4px 12px 12px}nav button{flex:1;color:var(--muted)}nav .chosen{background:var(--selected);color:var(--accent)}main{padding:0 12px 160px;max-width:680px;margin:auto}.tile{background:var(--surface);border-radius:22px;padding:16px;margin-bottom:9px;cursor:pointer}.tile.active{background:var(--selected)}.line{display:flex;align-items:center;gap:8px}.line strong{flex:1;overflow-wrap:anywhere}.address{color:var(--muted);font-size:14px;margin:7px 0}.pill{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:10px;padding:6px 9px;font-size:12px}.ping{color:var(--green);font-size:12px}.spacer{flex:1}.check{color:var(--accent)}footer{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;max-width:656px;margin:auto;background:var(--surface);border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px #0002}footer section{flex:1;min-width:0}small{color:var(--muted)}.power{width:60px;height:60px;background:var(--accent);color:var(--on);border-radius:22px;display:grid;place-items:center}.power.on{background:var(--green);color:var(--bg)}dialog{background:var(--surface);color:var(--fg);border:0;border-radius:24px;padding:20px;width:min(90%,360px)}dialog::backdrop{background:#0008}dialog button{display:block;width:100%;text-align:left;padding:10px}input,select{background:var(--bg);border:1px solid var(--muted);border-radius:12px;padding:10px;width:100%}#search{margin:0 12px 10px;width:calc(100% - 24px)}.note{font-size:11px;color:var(--muted);text-align:center;margin:8px}.speed{font-size:13px;margin-top:7px}
</style><body><header><button id="settings" aria-label="Menu">☰</button><strong>NieFigger Hub</strong><button id="searchBtn" aria-label="Search">⌕</button><button id="add" aria-label="Add">＋</button><button id="more" aria-label="Settings">⋮</button></header><input id="search" placeholder="Search profiles" hidden><nav id="groups"></nav><main id="profiles"></main><footer><section><strong id="status">Not connected</strong><br><small id="modeLabel">VPN Mode</small><div class="speed" id="speed">↓ 0 B/s　↑ 0 B/s</div></section><button class="power" id="power" aria-label="Connect"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></svg></button></footer><dialog id="modal"><div id="modalBody"></div><button onclick="modal.close()">Close</button></dialog><script>
const $=id=>document.getElementById(id);let group=0,active=0,on=false,mode='VPN',data=[[{name:'OPLUS_CH_450',type:'AmneziaWG',address:'192.0.2.10:51820',ping:24},{name:'Germany',type:'VLESS · REALITY',address:'Frankfurt',ping:42},{name:'Netherlands',type:'Hysteria2',address:'Amsterdam',ping:56}],[{name:'Europe 01',type:'VLESS · XHTTP',address:'Europe',ping:38}],[{name:'Reserve',type:'Shadowsocks',address:'Europe',ping:65}]];function el(tag,txt,cls){let e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}function btn(txt,fn){let b=el('button',txt);b.onclick=e=>{e.stopPropagation();fn()};return b}function render(){let g=$('groups');g.replaceChildren();['Main','Subscriptions','Reserve'].forEach((n,i)=>{let b=btn(n,()=>{group=i;active=0;on=false;render()});b.className=i===group?'chosen':'';g.append(b)});let p=$('profiles');p.replaceChildren();data[group].forEach((v,i)=>{if(!v.name.toLowerCase().includes($('search').value.toLowerCase()))return;let t=el('article','','tile'+(active===i?' active':''));t.onclick=()=>{active=i;on=false;render()};let a=el('div','','line');a.append(el('strong',v.name),el('span',active===i?'✓':'','check'));let b=el('div','','line');b.append(el('span',v.type,'pill'),el('span',v.ping+' ms','ping'),el('span','','spacer'),btn('✎',()=>edit(i)),btn('⋮',()=>actions(i)));t.append(a,el('div',v.address,'address'),b);p.append(t)});p.append(el('div','UI preview · simulated connection and traffic','note'));$('status').textContent=on?'Connected':'Not connected';$('modeLabel').textContent=mode+' Mode';$('speed').textContent=on?'↓ 12.4 MB/s　↑ 2.1 MB/s':'↓ 0 B/s　↑ 0 B/s';$('power').classList.toggle('on',on);$('power').setAttribute('aria-label',on?'Disconnect':'Connect')}
function open(title){let b=$('modalBody');b.replaceChildren(el('h3',title));$('modal').showModal();return b}function settings(){let b=open('Preview settings');b.append(btn('Switch light / dark',()=>{document.body.classList.toggle('light');localStorage.setItem('light',document.body.classList.contains('light'))}),btn('Mode: '+mode,()=>{mode=mode==='VPN'?'Root':'VPN';on=false;render();$('modal').close()}));let s=el('select','');[['Purple','#d0bcff','#6750a4'],['Blue','#aec6ff','#405e9b'],['Green','#a5d5b1','#386a49']].forEach((a,i)=>{let o=el('option',a[0]);o.value=i;s.append(o)});s.onchange=()=>{let a=[['#d0bcff','#6750a4','#35284d','#eaddff'],['#aec6ff','#405e9b','#253653','#dbe3ff'],['#a5d5b1','#386a49','#253d30','#c3ecd0']][s.value];document.body.style.setProperty('--accent',a[document.body.classList.contains('light')?1:0]);document.body.style.setProperty('--selected',a[document.body.classList.contains('light')?3:2])};b.append(s)}
function edit(i){let v=data[group][i],b=open('Edit profile'),inp=el('input','');inp.value=v.name;b.append(inp,btn('Save',()=>{v.name=inp.value||v.name;$('modal').close();render()}))}function actions(i){let b=open(data[group][i].name);b.append(btn('Duplicate',()=>{data[group].push({...data[group][i],name:data[group][i].name+' copy'});$('modal').close();render()}),btn('Test latency',()=>{data[group][i].ping=20+Math.floor(Math.random()*60);$('modal').close();render()}),btn('Delete',()=>{data[group].splice(i,1);active=0;on=false;$('modal').close();render()}))} $('settings').onclick=$('more').onclick=settings;$('searchBtn').onclick=()=>{$('search').hidden=!$('search').hidden;if(!$('search').hidden)$('search').focus()};$('search').oninput=render;$('add').onclick=()=>{data[group].push({name:'New profile',type:'VLESS',address:'Example server',ping:0});render()};$('power').onclick=()=>{if(data[group].length)on=!on;render()};if(localStorage.getItem('light')==='true')document.body.classList.add('light');render();
</script></body></html>
