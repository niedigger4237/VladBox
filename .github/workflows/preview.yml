name: Preview Build
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast: arm64 only (debug builds). Disable for a full multi-ABI build."
        type: boolean
        default: true
      compile_only:
        description: "Check Android Kotlin/Java compilation only (no APK, R8 or signing)."
        type: boolean
        default: false
      force_core_rebuild:
        description: "Force native core rebuild and Go validation."
        type: boolean
        default: false
env:
  GO_VERSION: "1.26.4"
jobs:
  native-build:
    uses: ./.github/workflows/native-build.yml
    with:
      ref: ${{ github.sha }}
      fast: ${{ inputs.fast }}
      force_core_rebuild: ${{ inputs.force_core_rebuild }}
  build:
    name: ${{ inputs.compile_only && 'Android Compile Check' || 'Build OSS APK' }}
    runs-on: ubuntu-latest
    needs:
      - native-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: go-core
          path: app
      - name: Download ROOT helpers
        uses: actions/download-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Go for SRS compiler
        if: ${{ !inputs.compile_only }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache SRS compiler
        if: ${{ !inputs.compile_only }}
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: srs-compiler-v2-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildScript/lib/assets.sh') }}
      - name: Restore keystore
        if: ${{ !inputs.compile_only }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Android Compile Check
        if: ${{ inputs.compile_only }}
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --build-cache --profile -PpreviewArm64Only=${{ inputs.fast }} app:compilePreviewReleaseKotlin app:compilePreviewReleaseJavaWithJavac
      - name: Gradle Build
        if: ${{ !inputs.compile_only }}
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --build-cache --profile -PpreviewArm64Only=${{ inputs.fast }} app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-profile
          path: build/reports/profile/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.compile_only }}
        with:
          name: APKs
          path: ${{ env.APK }}
