name: Preview Build
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast: arm64 only (debug builds). Disable for a full multi-ABI build."
        type: boolean
        default: true
jobs:
  check:
    name: Compile check (Go, fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-
            go-${{ runner.os }}-
      - name: Fetch core sources
        run: bash buildScript/lib/core/get_source.sh
      - name: Generate libcore go.mod
        working-directory: libcore
        run: bash ./sync_gomod.sh
      - name: Build libcore (type check, android/arm64)
        working-directory: libcore
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          go build -tags with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0 ./...
  libcore:
    needs: check
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-${{ inputs.fast }}
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-
            go-${{ runner.os }}-
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LIBCORE_TARGETS: ${{ inputs.fast && 'android/arm64' || '' }}
          ROOTCORE_ABIS: ${{ inputs.fast && 'arm64-v8a' || '' }}
        run: |
          ./run lib core
          ./run lib rootcore
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-${{ inputs.fast }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
