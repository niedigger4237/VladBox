name: Preview Build
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast: arm64 only (debug builds). Disable for a full multi-ABI build."
        type: boolean
        default: true
      compile_only:
        description: "Check Android Kotlin/Java compilation only (no APK, R8 or signing)."
        type: boolean
        default: false
      force_core_rebuild:
        description: "Force native core rebuild and Go validation."
        type: boolean
        default: false
      awg_test:
        description: "Only run the AmneziaWG loopback test (no APK build)."
        type: boolean
        default: false
jobs:
  awg-test:
    name: AWG loopback test
    if: ${{ inputs.awg_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Build stock and patched sing-box-extended
        run: |
          set -e
          source buildScript/lib/core/get_source_env.sh
          TAGS=with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
          git clone --no-checkout "$SING_BOX_REPO" ../stock
          git -C ../stock checkout -q "$SING_BOX_COMMIT"
          (cd ../stock && go build -tags "$TAGS" -o "$GITHUB_WORKSPACE/sb-stock" ./cmd/sing-box)
          bash buildScript/lib/core/get_source.sh
          (cd ../sing-box && go build -tags "$TAGS" -o "$GITHUB_WORKSPACE/sb-patched" ./cmd/sing-box)
      - name: Loopback tests
        run: |
          set +e
          fail=0
          T=buildScript/test/awg_loopback.sh
          for bin in sb-patched; do
            bash $T "$PWD/$bin" "$bin/awg2.0" '{}' 1420 || fail=1
            bash $T "$PWD/$bin" "$bin/awg2.0-mtu1280" '{}' 1280 || fail=1
            bash $T "$PWD/$bin" "$bin/awg-no-s3s4" '{"s3":0,"s4":0}' 1420 || fail=1
            bash $T "$PWD/$bin" "$bin/awg3.1" '{"random_trailers":true}' 1420 || fail=1
            bash $T "$PWD/$bin" "$bin/h-single-numbers" '{"h1":"1020325451","h2":"3288052141","h3":"1766607858","h4":"2528465083"}' 1420 || fail=1
            bash $T "$PWD/$bin" "$bin/i1-i5" '{"i1":"<b 0xc0000000010800000000><r 20><t>","i2":"<b 0xdeadbeef><rc 8>","i3":"<r 12>","i4":"<rd 6>","i5":"<b 0x00>"}' 1420 || fail=1
            bash $T "$PWD/$bin" "$bin/wg-plain" '{"jc":0,"jmin":0,"jmax":0,"s1":0,"s2":0,"s3":0,"s4":0,"h1":null,"h2":null,"h3":null,"h4":null}' 1420 || fail=1
          done
          exit $fail
  awg-interop:
    name: AWG interop (reference server)
    if: ${{ inputs.awg_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Build client and reference servers
        run: |
          set -e
          source buildScript/lib/core/get_source_env.sh
          TAGS=with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0
          bash buildScript/lib/core/get_source.sh
          (cd ../sing-box && go build -tags "$TAGS" -o "$GITHUB_WORKSPACE/sb-patched" ./cmd/sing-box)
          for t in v3.1.20261116 v3.0.3; do
            git clone -q --depth 1 --branch $t https://github.com/amnezia-vpn/amneziawg-go ../awg-$t
            (cd ../awg-$t && go build -o "$GITHUB_WORKSPACE/awg-$t" .)
          done
      - name: Interop tests
        run: |
          set +e
          fail=0
          T=buildScript/test/awg_interop.sh
          for ref in v3.1.20261116 v3.0.3; do
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/default" '{}' 1420 || fail=1
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/no-s3s4" '{"s3":0,"s4":0}' 1420 || fail=1
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/mtu1280" '{}' 1280 || fail=1
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/user-params" '{"jc":3,"jmin":1,"jmax":3,"s1":1,"s2":2,"s3":0,"s4":0,"h1":"1","h2":"2","h3":"3","h4":"4"}' 1280 || fail=1
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/user-params-i1" '{"jc":3,"jmin":1,"jmax":3,"s1":1,"s2":2,"s3":0,"s4":0,"h1":"1","h2":"2","h3":"3","h4":"4","i1":"<b 0xc400000001015c0000><r 40>"}' 1280 || fail=1
            bash $T "$PWD/sb-patched" "$PWD/awg-$ref" "ref-$ref/h-single" '{"h1":"1020325451","h2":"3288052141","h3":"1766607858","h4":"2528465083"}' 1420 || fail=1
          done
          exit $fail
  libcore:
    name: Go Compile Check (LibCore / sing-box)
    if: ${{ !inputs.awg_test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Go core cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          key: go-core-v4-go1.26.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libcore/**', 'buildScript/init/**', 'buildScript/lib/core.sh', 'buildScript/lib/core/init.sh', 'buildScript/lib/core/build.sh', 'buildScript/lib/core/build_root_core.sh', 'buildScript/lib/core/get_source*.sh', 'buildScript/lib/core/patches/**', 'run') }}-${{ inputs.fast }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Go compiler cache
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-v4-go1.26.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libcore/**', 'buildScript/init/**', 'buildScript/lib/core/get_source*.sh', 'buildScript/lib/core/patches/**', 'buildScript/lib/core/build*.sh') }}-${{ inputs.fast }}
          restore-keys: |
            go-build-v4-go1.26.4-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile Go libraries
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        env:
          LIBCORE_TARGETS: ${{ inputs.fast && 'android/arm64' || '' }}
          ROOTCORE_ABIS: ${{ inputs.fast && 'arm64-v8a' || '' }}
        run: |
          set -e
          ./run lib core
          bash buildScript/lib/core/build_root_core.sh
      - name: Validate Go outputs
        run: |
          set -e
          test -s app/libs/libcore.aar
          unzip -tq app/libs/libcore.aar
          abis="arm64-v8a"
          if [ "${{ inputs.fast }}" != "true" ]; then abis="arm64-v8a armeabi-v7a x86_64"; fi
          for abi in $abis; do
            test -s "app/src/main/jniLibs/$abi/libsingbox.so"
            unzip -Z1 app/libs/libcore.aar | grep -F "jni/$abi/" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-core
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          if-no-files-found: error
  native:
    name: Native Compile Check (ROOT helpers)
    if: ${{ !inputs.awg_test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Native helpers cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/*/libasteriskd.so
            app/src/main/jniLibs/*/libhevtun.so
            app/src/main/jniLibs/*/libbpf2socks.so
          key: native-helpers-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildScript/init/**', 'buildScript/lib/core/build_asteriskd.sh', 'buildScript/lib/core/build_root_helpers.sh') }}-${{ inputs.fast }}
      - name: Compile ROOT helpers
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        env:
          ROOTCORE_ABIS: ${{ inputs.fast && 'arm64-v8a' || '' }}
        run: |
          set -e
          bash buildScript/lib/core/build_asteriskd.sh
          bash buildScript/lib/core/build_root_helpers.sh
      - name: Validate native outputs
        run: |
          set -e
          abis="arm64-v8a"
          if [ "${{ inputs.fast }}" != "true" ]; then abis="arm64-v8a armeabi-v7a x86_64"; fi
          for abi in $abis; do
            for lib in libasteriskd.so libhevtun.so libbpf2socks.so; do
              test -s "app/src/main/jniLibs/$abi/$lib"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs/
          if-no-files-found: error
  build:
    name: ${{ inputs.compile_only && 'Android Compile Check' || 'Build OSS APK' }}
    runs-on: ubuntu-latest
    needs:
      - libcore
      - native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: go-core
          path: app
      - name: Download ROOT helpers
        uses: actions/download-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Go for SRS compiler
        if: ${{ !inputs.compile_only }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Cache SRS compiler
        if: ${{ !inputs.compile_only }}
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: srs-compiler-v2-go1.26.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildScript/lib/assets.sh') }}
      - name: Restore keystore
        if: ${{ !inputs.compile_only }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Android Compile Check
        if: ${{ inputs.compile_only }}
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./gradlew --build-cache --profile -PpreviewArm64Only=${{ inputs.fast }} app:compilePreviewReleaseKotlin app:compilePreviewReleaseJavaWithJavac
      - name: Gradle Build
        if: ${{ !inputs.compile_only }}
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --build-cache --profile -PpreviewArm64Only=${{ inputs.fast }} app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-profile
          path: build/reports/profile/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.compile_only }}
        with:
          name: APKs
          path: ${{ env.APK }}
