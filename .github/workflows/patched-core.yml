name: Patched ROOT Core
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish validated core-only prerelease"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: patched-root-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/tethering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Prepare pinned sources and build all supported ROOT ABIs
        shell: bash
        run: |
          set -euo pipefail
          bash buildScript/lib/core/get_source.sh
          ROOTCORE_ABIS="arm64-v8a armeabi-v7a x86_64" bash buildScript/lib/core/build_root_core.sh
      - name: Package verified cores
        shell: bash
        run: |
          set -eo pipefail
          source buildScript/lib/core/get_source_env.sh
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            binary="app/src/main/jniLibs/$abi/libsingbox.so"
            test -s "$binary"
            cp "$binary" "dist/niefigger-sing-box-android-$abi"
            go version -m "$binary"
          done
          printf 'compatibility=1\nsource=%s\nsing-box=%s\nutls=%s\n' "$GITHUB_SHA" "$SING_BOX_COMMIT" "$UTLS_COMMIT" > dist/build-info.txt
          (cd dist && sha256sum niefigger-sing-box-android-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: patched-root-core
          path: dist/
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/tethering' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patched-root-core
          path: dist
      - name: Publish immutable core release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="core-v1-$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "dist/niefigger-sing-box-android-$abi"
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Core release already exists; refusing to overwrite $tag" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "NieFigger Patched ROOT Core ${GITHUB_SHA:0:12}" --prerelease --latest=false --draft \
            --notes-file dist/build-info.txt
          gh release upload "$tag" dist/niefigger-sing-box-android-* dist/SHA256SUMS dist/build-info.txt --repo "$GH_REPO"
          gh release edit "$tag" --draft=false --prerelease --latest=false --repo "$GH_REPO"
