name: Update ByeDPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag or full commit SHA'
        required: true
        default: 'v0.17.3'
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: material-interface
      - name: Build Android binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash buildScript/update-byedpi.sh "$VERSION"
      - name: Create update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-byedpi
          base: material-interface
          title: Update ByeDPI binaries
          commit-message: Update ByeDPI binaries
          add-paths: |
            app/src/main/jniLibs/*/libciadpi.so
            third_party/byedpi/*
