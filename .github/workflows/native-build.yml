name: Shared Native Build
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      fast:
        type: boolean
        default: false
      force_core_rebuild:
        type: boolean
        default: false
env:
  GO_VERSION: "1.26.4"
jobs:
  libcore:
    name: Go Compile Check (LibCore / sing-box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Resolve native toolchain fingerprint
        id: toolchain
        shell: bash
        run: |
          set -e
          source buildScript/init/env_ndk.sh
          fingerprint=$(sha256sum "$ANDROID_NDK_HOME/source.properties" | cut -d' ' -f1)
          echo "ndk=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Resolve gomobile source revision
        id: gomobile
        run: |
          set -e
          revision=$(git ls-remote https://github.com/MatsuriDayo/gomobile.git refs/heads/master2 | cut -f1)
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Go core cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          key: go-core-v4-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.ndk }}-${{ steps.gomobile.outputs.revision }}-${{ hashFiles('libcore/**', 'buildScript/init/**', 'buildScript/lib/core.sh', 'buildScript/lib/core/init.sh', 'buildScript/lib/core/build.sh', 'buildScript/lib/core/build_root_core.sh', 'buildScript/lib/core/get_source*.sh', 'buildScript/lib/core/patches/**', 'run') }}-${{ inputs.fast }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go compiler cache
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-v4-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.ndk }}-${{ steps.gomobile.outputs.revision }}-${{ hashFiles('libcore/**', 'buildScript/init/**', 'buildScript/lib/core/get_source*.sh', 'buildScript/lib/core/patches/**', 'buildScript/lib/core/build*.sh') }}-${{ inputs.fast }}
          restore-keys: |
            go-build-v4-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile Go libraries
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        env:
          GOMOBILE_REVISION: ${{ steps.gomobile.outputs.revision }}
          LIBCORE_TARGETS: ${{ inputs.fast && 'android/arm64' || '' }}
          ROOTCORE_ABIS: ${{ inputs.fast && 'arm64-v8a' || '' }}
        run: |
          set -e
          ./run lib core
          bash buildScript/lib/core/build_root_core.sh
      - name: Validate Go outputs
        run: |
          set -e
          test -s app/libs/libcore.aar
          unzip -tq app/libs/libcore.aar
          abis="arm64-v8a"
          if [ "${{ inputs.fast }}" != "true" ]; then abis="arm64-v8a armeabi-v7a x86_64"; fi
          for abi in $abis; do
            test -s "app/src/main/jniLibs/$abi/libsingbox.so"
            unzip -Z1 app/libs/libcore.aar | grep -F "jni/$abi/" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: go-core
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
          if-no-files-found: error
  native:
    name: Native Compile Check (ROOT helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Resolve native toolchain fingerprint
        id: toolchain
        shell: bash
        run: |
          set -e
          source buildScript/init/env_ndk.sh
          fingerprint=$(sha256sum "$ANDROID_NDK_HOME/source.properties" | cut -d' ' -f1)
          echo "ndk=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Native helpers cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/*/libasteriskd.so
            app/src/main/jniLibs/*/libhevtun.so
            app/src/main/jniLibs/*/libbpf2socks.so
          key: native-helpers-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('buildScript/init/**', 'buildScript/lib/core/build_asteriskd.sh', 'buildScript/lib/core/build_root_helpers.sh') }}-${{ inputs.fast }}
      - name: Compile ROOT helpers
        if: steps.cache.outputs.cache-hit != 'true' || inputs.force_core_rebuild
        env:
          ROOTCORE_ABIS: ${{ inputs.fast && 'arm64-v8a' || '' }}
        run: |
          set -e
          bash buildScript/lib/core/build_asteriskd.sh
          bash buildScript/lib/core/build_root_helpers.sh
      - name: Validate native outputs
        run: |
          set -e
          abis="arm64-v8a"
          if [ "${{ inputs.fast }}" != "true" ]; then abis="arm64-v8a armeabi-v7a x86_64"; fi
          for abi in $abis; do
            for lib in libasteriskd.so libhevtun.so libbpf2socks.so; do
              test -s "app/src/main/jniLibs/$abi/$lib"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs/
          if-no-files-found: error
