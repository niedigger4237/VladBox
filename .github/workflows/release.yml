name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (e.g. v1.0)"
        required: true
      publish:
        description: "Publish GitHub Release after successful build"
        type: boolean
        default: false
      play:
        description: "Build Google Play AAB"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create or move tag
        run: |
          [[ "$TAG" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tag $TAG -> $GITHUB_SHA"
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Golang Status
        run: find buildScript libcore -maxdepth 6 -type f \( -path "buildScript/*" -o -name "*.sh" \) -not -path "libcore/*/*" | LC_ALL=C sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | LC_ALL=C sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
            app/src/main/jniLibs/*/libasteriskd.so
            app/src/main/jniLibs/*/libhevtun.so
            app/src/main/jniLibs/*/libbpf2socks.so
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/get_source_env.sh') }}-
            go-${{ runner.os }}-
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./run lib core
          ./run lib rootcore
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - tag
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Golang Status
        run: find buildScript libcore -maxdepth 6 -type f \( -path "buildScript/*" -o -name "*.sh" \) -not -path "libcore/*/*" | LC_ALL=C sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | LC_ALL=C sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
            app/src/main/jniLibs/*/libasteriskd.so
            app/src/main/jniLibs/*/libhevtun.so
            app/src/main/jniLibs/*/libbpf2socks.so
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASS" && test -n "$ALIAS_PASS" || { echo "Missing signing secrets" >&2; exit 1; }
          printf %s "$KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assembleOssRelease \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$((1000 + ${{ github.run_number }}))"
          APK_DIR=app/build/outputs/apk
          test -d "$APK_DIR"
          test "$(find "$APK_DIR" -type f -name '*.apk' | wc -l)" -gt 0
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find artifacts -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0 || { echo "No APK artifacts" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "${apks[@]}" --title "$TAG" --generate-notes --verify-tag

  play:
    name: Build Play Bundle
    if: ${{ inputs.play }}
    runs-on: ubuntu-latest
    needs:
      - tag
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Golang Status
        run: find buildScript libcore -maxdepth 6 -type f \( -path "buildScript/*" -o -name "*.sh" \) -not -path "libcore/*/*" | LC_ALL=C sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | LC_ALL=C sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
            app/src/main/jniLibs/*/libsingbox.so
            app/src/main/jniLibs/*/libasteriskd.so
            app/src/main/jniLibs/*/libhevtun.so
            app/src/main/jniLibs/*/libbpf2socks.so
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew bundlePlayRelease \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$((1000 + ${{ github.run_number }}))"
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
