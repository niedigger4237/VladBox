name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (e.g. v1.0)"
        required: true
      publish:
        description: "Publish GitHub Release after successful build"
        type: boolean
        default: false
      play:
        description: "Build Google Play AAB"
        type: boolean
        default: false
permissions:
  contents: write
env:
  GO_VERSION: "1.26.4"
jobs:
  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create or move tag
        run: |
          [[ "$TAG" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tag $TAG -> $GITHUB_SHA"
  native-build:
    needs: tag
    uses: ./.github/workflows/native-build.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      fast: false
      native_naive: true
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - tag
      - native-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download Go libraries
        uses: actions/download-artifact@v4
        with:
          name: go-core
          path: app
      - name: Download ROOT helpers
        uses: actions/download-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Go for SRS compiler
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache SRS compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: srs-compiler-v2-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildScript/lib/assets.sh') }}
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASS" && test -n "$ALIAS_PASS" || { echo "Missing signing secrets" >&2; exit 1; }
          printf %s "$KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --build-cache -PnativeNaive=true app:assembleOssRelease \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$((1000 + ${{ github.run_number }}))"
          APK_DIR=app/build/outputs/apk
          test -d "$APK_DIR"
          test "$(find "$APK_DIR" -type f -name '*.apk' | wc -l)" -gt 0
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find artifacts -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0 || { echo "No APK artifacts" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" "${apks[@]}" --title "$TAG" --generate-notes --verify-tag

  play:
    name: Build Play Bundle
    if: ${{ inputs.play }}
    runs-on: ubuntu-latest
    needs:
      - tag
      - native-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Fix permissions
        run: find . -type f \( -name '*.sh' -o -name run -o -name gradlew \) -not -path './.git/*' -exec chmod +x {} +
      - name: Download Go libraries
        uses: actions/download-artifact@v4
        with:
          name: go-core
          path: app
      - name: Download ROOT helpers
        uses: actions/download-artifact@v4
        with:
          name: native-helpers
          path: app/src/main/jniLibs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Go for SRS compiler
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache SRS compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: srs-compiler-v2-go${{ env.GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildScript/lib/assets.sh') }}
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Gradle Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: vladbox
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --build-cache -PnativeNaive=true -PnativeBundle=true app:bundlePlayRelease \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$((1000 + ${{ github.run_number }}))"
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
